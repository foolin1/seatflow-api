name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SeatFlow.sln

      - name: Build solution
        run: >
          dotnet build SeatFlow.sln
          --configuration Release
          --no-restore

      - name: Run tests
        run: >
          dotnet test SeatFlow.sln
          --configuration Release
          --no-build
          --verbosity normal
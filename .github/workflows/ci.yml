name: SeatFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore SeatFlow.sln

      - name: Build
        run: >
          dotnet build SeatFlow.sln
          --configuration Release
          --no-restore

      - name: Run tests
        run: >
          dotnet test SeatFlow.sln
          --configuration Release
          --no-build
          --logger "trx"
          --results-directory TestResults

  docker-smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs:
      - build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=seatflow
          POSTGRES_USER=seatflow
          POSTGRES_PASSWORD=SeatFlow_CI_Database_Password_2026
          POSTGRES_PORT=5433
          API_PORT=8080
          ASPNETCORE_ENVIRONMENT=Development
          JWT_SIGNING_KEY=SeatFlow_CI_Only_Signing_Key_2026_At_Least_32_Characters
          EOF

      - name: Build and start containers
        run: docker compose up --build --detach

      - name: Wait for API readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent \
              http://localhost:8080/health/ready; then
              echo
              echo "SeatFlow API is ready."
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs
          exit 1

      - name: Run smoke test
        shell: pwsh
        run: >
          ./scripts/smoke-test.ps1
          -BaseUrl http://localhost:8080

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down --volumes